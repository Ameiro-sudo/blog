    <style>
        :root {
            --color-bg-deep: #0b2b3b;
            --color-accent: #8fd8ef;
            --glass-bg: rgba(255,255,255,0.12);
            --glass-border: rgba(255,255,255,0.20);
            --glass-hover-bg: rgba(255,255,255,0.22);
            --glass-header-bg: rgba(11,43,59,0.55);
            --shadow-card: 0 30px 60px -16px rgba(0,0,0,0.45);
            --shadow-item: 0 4px 16px -6px rgba(0,0,0,0.15);
            --shadow-toast: 0 8px 30px rgba(0,0,0,0.35);
            --radius-card: 3rem;
            --radius-item: 1.5rem;
            --font-mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
            --font-sans: 'Segoe UI',Roboto,'Helvetica Neue',system-ui,-apple-system,sans-serif;
            --font-title: 'ZCOOL KuaiLe', cursive, var(--font-sans);
            --body-pad: clamp(1.2rem, 5.88vw, 2.5rem);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            min-height: 100vh;
            padding: var(--body-pad);
            font-family: var(--font-sans);
            background: var(--bg-gradient);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body.bg-loaded {
            background: var(--color-bg-deep) url('https://snowblock.top/138936740_p0.webp') center/cover fixed;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.08);
            pointer-events: none;
            z-index: 0;
        }

        body > * { position: relative; z-index: 1; }

        #snowCanvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }
        body.bg-loaded #snowCanvas { opacity: 1; }
        #loader.hidden ~ #snowCanvas { opacity: 1; }

        /* ===== 加载层（导航页统一风格） ===== */
        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #d4eaf7, #b8d8ee, #d4eaf7);
            background-size: 200% 200%;
            animation: loaderBgShift 6s ease infinite;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
        }

        @keyframes loaderBgShift {
            0%   { background-position: 0% 0%; }
            50%  { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
        }

        .loader-crystal {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .crystal-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crystal-svg {
            width: 90px;
            height: 90px;
            animation: crystalFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(143,216,239,0.3));
        }

        @keyframes crystalFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(-8px) rotate(3deg); }
            75%      { transform: translateY(4px) rotate(-2deg); }
        }

        .crystal-svg .main-line {
            stroke-dasharray: 360;
            stroke-dashoffset: 360;
            animation: drawCrystal 3.5s ease-in-out infinite alternate;
        }

        .crystal-svg .inner-line {
            stroke-dasharray: 240;
            stroke-dashoffset: 240;
            animation: drawCrystal 3.5s ease-in-out 0.6s infinite alternate;
        }

        .crystal-svg .core-line {
            stroke-dasharray: 80;
            stroke-dashoffset: 80;
            animation: drawCrystal 2.5s ease-in-out 1.2s infinite alternate;
        }

        @keyframes drawCrystal {
            0%   { stroke-dashoffset: 360; }
            60%  { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 0; }
        }

        .crystal-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(143,216,239,0.15), transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.8; transform: scale(1.2); }
        }

        .loader-text-frost {
            font-family: var(--font-title);
            font-size: 1.3rem;
            background: linear-gradient(135deg, #8fd8ef, #c0f0ff, #ffe6b0, #8fd8ef);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: frostShift 4s ease infinite;
        }

        @keyframes frostShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .loader-dots {
            display: flex;
            gap: 6px;
            margin-top: 0.2rem;
        }

        .loader-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #8fd8ef;
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%,100% { transform: translateY(0); opacity: 0.3; }
            50%      { transform: translateY(-8px); opacity: 1; }
        }

        /* ---------- 主内容区 ---------- */
        .container { max-width: 1000px; margin: 0 auto; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            padding: 0.7rem 1.8rem;

        .site-name {

        .page-header { text-align: center; margin-bottom: 2.8rem; }
        .page-header h1 {

            background: linear-gradient(135deg, #FFEFC0, #B8E4FF);
            -webkit-background-clip: text; background-clip: text;
            color: transparent; text-shadow: 0 2px 10px rgba(0,0,0,0.2);

        .page-header .sub {

        .page-header .sub a { color: var(--color-accent); text-decoration: none; }

        .post-list { display: flex; flex-direction: column; gap: 1.3rem; }
        .post-card {
            background: var(--glass-bg);
            backdrop-filter: blur(14px) saturate(1.2);
            border-radius: var(--radius-card);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-item);
            transition: transform var(--transition), box-shadow var(--transition);
            cursor: pointer; outline: none;
        }
        .post-card:focus-visible {
            outline: 2px solid var(--color-accent); outline-offset: 4px; transform: scale(0.99);
        }
        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 40px -18px rgba(0,0,0,0.5);
            background: rgba(255,255,255,0.18);
        }
        .post-body { padding: 1.4rem 1.8rem; }
        .post-meta {
            display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center;
            margin-bottom: 0.6rem; font-size: 0.7rem; font-family: var(--font-mono);
            color: rgba(210,235,250,0.6);
        }
        .tag {
            display: inline-block; padding: 2px 10px; border-radius: 40px;
            font-size: 0.65rem; font-weight: 500;
            background: rgba(143,216,239,0.18); color: #b9e6ff; letter-spacing: 0.3px;
        }
        .tag.bash { background: rgba(0,0,0,0.35); color: #b3e4ff; }
        .tag.tech { background: rgba(76,175,80,0.2); color: #a5d6a5; }
        .tag.game { background: rgba(255,152,0,0.2); color: #ffcd94; }
        .tag.life { background: rgba(233,30,99,0.2); color: #ffb7c5; }
        .tag.test { background: rgba(156,39,176,0.25); color: #daaaff; }

        .post-title {
            font-size: clamp(1.15rem, 3vw, 1.5rem); font-weight: 600;
            color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,0.25);
            margin-bottom: 0.5rem; line-height: 1.35;
        }
        .post-excerpt {
            color: rgba(220,240,255,0.85); font-size: 0.9rem; line-height: 1.5;
        }
        .post-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 1rem; padding-top: 0.7rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .read-more {
            color: var(--color-accent); font-size: 0.8rem; font-family: var(--font-mono);
            text-decoration: none; transition: color var(--transition);
        }
        .read-more:hover { color: white; }
        .post-date { color: rgba(200,230,250,0.45); font-size: 0.7rem; font-family: var(--font-mono); }

        .article-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(1.3);
            border-radius: var(--radius-card);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card); overflow: hidden;
        }
        .article-body { padding: 2rem 2.2rem; }
        .article-title {
            font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        .article-meta {
            display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center;
            margin-bottom: 1.8rem; font-size: 0.8rem; font-family: var(--font-mono);
            color: rgba(200,235,250,0.6);
        }
        .article-content {
            color: rgba(235,245,255,0.92); font-size: 0.96rem; line-height: 1.75;
        }
        .article-content p { margin-bottom: 1rem; }
        .article-content h2 {
            font-size: 1.4rem; font-weight: 600; color: white;
            margin: 1.6rem 0 0.8rem; border-left: 3px solid var(--color-accent);
            padding-left: 0.9rem;
        }
        .article-content h3 { font-size: 1.2rem; font-weight: 600; color: #f0fcff; margin: 1.2rem 0 0.6rem; }
        .article-content code {
            background: rgba(0,0,0,0.4); padding: 0.2rem 0.4rem;
            border-radius: 8px; font-family: var(--font-mono); font-size: 0.85em; color: var(--color-accent);
        }
        .article-content pre {
            margin: 1rem 0; background: rgba(0,0,0,0.45);
            padding: 1rem 1.2rem; border-radius: 14px; overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.1); font-family: var(--font-mono); font-size: 0.85rem;
        }
        .code-block-wrapper { position: relative; margin: 1rem 0; }
        .copy-btn {
            position: absolute; top: 0.5rem; right: 0.7rem;
            background: rgba(30,50,65,0.7); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3); color: #eef5ff;
            font-family: var(--font-mono); font-size: 0.7rem;
            padding: 0.2rem 0.7rem; border-radius: 28px;
            cursor: pointer; transition: all 0.2s; z-index: 3;
        }
        .copy-btn:hover { background: var(--color-accent); color: #0b2b3b; border-color: var(--color-accent); }
        .copy-btn.copied { background: #4caf50; color: white; border-color: #4caf50; }
        .table-responsive { overflow-x: auto; margin: 1rem 0; border-radius: 12px; }
        .article-content table {
            width: 100%; border-collapse: collapse;
            background: rgba(0,0,0,0.25); border-radius: 14px; overflow: hidden;
        }
        .article-content th, .article-content td {
            border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; text-align: left;
        }
        .article-content th { background: rgba(143,216,239,0.2); color: white; }
        .article-content img {
            max-width: 100%; border-radius: 16px; margin: 1rem 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25); height: auto;
        }
        .article-content a {
            color: var(--color-accent); text-decoration: none;
            border-bottom: 1px dotted rgba(143,216,239,0.4);
        }
        .article-content a:hover { color: white; border-bottom-color: white; }
        .back-link {
            display: inline-block; margin-top: 2rem;
            color: rgba(210,235,250,0.7); font-family: var(--font-mono);
            font-size: 0.85rem; text-decoration: none; transition: color var(--transition);
        }
        .back-link:hover { color: var(--color-accent); }

        /* ===== 搜索栏 ===== */
        .search-bar {
            margin-top: 1.2rem;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 480px;
            padding: 0.7rem 1.2rem;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(8px) saturate(1.2);
            -webkit-backdrop-filter: blur(8px) saturate(1.2);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-item);
            color: #fff;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: border var(--transition), background var(--transition);
        }

        .search-input::placeholder { color: rgba(200,235,250,0.50); }
        .search-input:focus {
            border-color: var(--color-accent);
            background: rgba(255,255,255,0.16);
        }

        /* ===== 分页 ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px) saturate(1.2);
            -webkit-backdrop-filter: blur(8px) saturate(1.2);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-item);
            color: rgba(220,240,255,0.80);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            outline: none;
        }

        .page-btn:hover { background: var(--glass-hover-bg); color: #fff; }
        .page-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
        .page-btn.active {
            background: rgba(143,216,239,0.20);
            color: var(--color-accent);
            border-color: rgba(143,216,239,0.30);
        }
        .page-btn:disabled { opacity: 0.35; cursor: default; }

        .page-info {
            color: rgba(200,235,250,0.50);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0 0.3rem;
        }

        .hljs { background: transparent !important; }

        /* ===== 暗色模式 ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background:
                    url('https://snowblock.top/138936740_p0.webp') center / cover no-repeat fixed,
                    linear-gradient(160deg, #0b1a24, #162b36);
            }

            body::before {
                background: rgba(0,0,0,0.25);
            }

            #loader {
                background: linear-gradient(135deg, #0d1f2b, #142a38, #0d1f2b);
                background-size: 200% 200%;
            }

            .top-bar {
                --glass-header-bg: rgba(0, 15, 25, 0.70);
            }

            .post-card { background: rgba(0, 18, 30, 0.50); }
            .post-card:hover { background: rgba(255,255,255,0.08); }
            .article-card { background: rgba(0, 18, 30, 0.50); }
            .search-input { background: rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.08); }
            .search-input:focus { background: rgba(0,0,0,0.35); }
            .page-btn { background: rgba(0,0,0,0.20); border-color: rgba(255,255,255,0.06); }
            .page-btn:hover { background: rgba(255,255,255,0.08); }
            .page-btn.active { background: rgba(143,216,239,0.12); }
        }

        /* ===== 打印 ===== */
        @media print {
            body::before { display: none; }
            body { background: #fff !important; padding: 1rem; }
            #loader { display: none; }
            #snowCanvas { display: none; }
            .top-bar { background: #f5f5f5; backdrop-filter: none; border-color: #ddd; }
            .top-bar .site-name { background: none; color: #0b2b3b; }
            .nav-links a { color: #555; }
            .article-card { background: #fafafa; backdrop-filter: none; border: 1px solid #ddd; box-shadow: none; }
            .article-title { color: #0b2b3b; text-shadow: none; }
            .article-content { color: #333; }
            .article-content code { background: #f0f0f0; color: #333; }
            .article-content a { color: #1a73e8; }
            .back-link, .search-bar { display: none; }
            .article-content pre { background: #f5f5f5; border-color: #ddd; }
            .copy-btn { display: none; }
            .post-card { background: #fafafa; backdrop-filter: none; border: 1px solid #ddd; box-shadow: none; }
            .post-card:hover { transform: none; }
            .post-title { color: #0b2b3b; text-shadow: none; }
            .post-excerpt { color: #555; }
        }
            :root { --body-pad: 1rem; }
            .top-bar { padding: 0.6rem 1.2rem; }
            .post-body { padding: 1rem 1.2rem; }
            .article-body { padding: 1.4rem 1.2rem; }
            .nav-links { gap: 1rem; }
        }
        @media (max-width: 480px) {
            .post-title { font-size: 1.2rem; }
            .article-title { font-size: 1.6rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            #snowCanvas { display: none; }
            body { background: var(--color-bg-deep) url('https://snowblock.top/138936740_p0.webp') center/cover fixed; }
            .post-card:hover { transform: none; }
        }

                      d="M50 15 L50 85
                         M50 15 L65 30 L50 50
                         M50 15 L35 30 L50 50
                         M50 85 L65 70 L50 50
                         M50 85 L35 70 L50 50
                         M50 50 L85 50
                         M65 30 L85 50
                         M35 30 L15 50
                         M65 70 L85 50
                         M35 70 L15 50" />
                <path class="core-line" stroke="#ffe6b0" stroke-width="1.8" stroke-linecap="round"
                      fill="none"
                      d="M50 38 L50 62
                         M50 38 L57 44 L50 50
                         M50 38 L43 44 L50 50
                         M50 62 L57 56 L50 50
                         M50 62 L43 56 L50 50
                         M50 50 L62 50
                         M57 44 L62 50
                         M43 44 L38 50
                         M57 56 L62 50
                         M43 56 L38 50" />
            </svg>
        </div>
        <div class="loader-text-frost">❄️ 正在连接雪境</div>
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>

<canvas id="snowCanvas"></canvas>

<div class="container" id="app">
    <header class="top-bar">
        <a href="https://snowblock.top" class="site-name" aria-label="主页">❄️ SnowBlock</a>
        <nav class="nav-links" aria-label="主导航">
            <a href="https://snowblock.top">导航</a>
            <a href="#" class="active" aria-current="page">博客</a>
            <a href="https://status.snowblock.top">MC 状态</a>
        </nav>
    </header>

    <div class="page-header">
        <h1>雪地笔记</h1>
        <p class="sub">
            <a href="https://snowblock.top">❄️ SnowBlock</a>
            <span style="color:rgba(200,235,250,0.3);margin:0 6px;">·</span>
            技术碎片 · 测试合集 · 代码光影
        </p>
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索文章标题、标签或内容..." aria-label="搜索文章">
        </div>
    </div>

    <div id="postList">
        <div id="dynamicPostList" class="post-list"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div id="articleView" style="display:none;">
        <div class="article-card">
            <div class="article-body">
                <h1 class="article-title" id="articleTitle"></h1>
                <div class="article-meta" id="articleMeta"></div>
                <div class="article-content" id="articleContent"></div>
                <a href="#" id="backToList" class="back-link" aria-label="返回列表">← 返回文章列表</a>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        const loader = document.getElementById('loader');
        const bgImg = new Image();
        bgImg.src = 'https://snowblock.top/138936740_p0.webp';
        bgImg.onload = () => document.body.classList.add('bg-loaded');
        bgImg.onerror = () => console.warn('背景图加载失败');
        if (bgImg.complete) document.body.classList.add('bg-loaded');

        setTimeout(() => {
            loader.classList.add('hidden');
            setTimeout(() => { if (loader.style.display !== 'none') loader.style.display = 'none'; }, 600);
        }, 2000);

        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [], w, h;
        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        function createParticle() {
            return {
                x: Math.random() * w, y: Math.random() * h - 20,
                r: Math.random() * 2.4 + 1.0, speed: Math.random() * 0.6 + 0.2,
                wind: Math.random() * 0.3 - 0.12, alpha: Math.random() * 0.4 + 0.15
            };
        }
        function initSnow() { particles = Array.from({ length: 48 }, createParticle); }
        function drawSnow() {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${p.alpha})`; ctx.fill();
                p.y += p.speed; p.x += p.wind;
                if (p.y > h + 25) particles[i] = createParticle();
                if (p.x > w + 20) p.x = -15; if (p.x < -20) p.x = w + 10;
            }
            while (particles.length < 55) particles.push(createParticle());
            requestAnimationFrame(drawSnow);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); initSnow(); drawSnow();

        /* ========== 博客逻辑 ========== */
        window.addEventListener('load', () => {
            if (!window.markdownit || !window.hljs || !window.DOMPurify) {
                document.body.innerHTML += '<div style="color:white;text-align:center;padding:2rem;">核心依赖加载失败，请检查网络后刷新</div>';
                return;
            }

            const md = window.markdownit({
                html: true, linkify: true, typographer: true,
                highlight: function (str, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return '<pre class="hljs"><code>' +
                                   hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                                   '</code></pre>';
                        } catch (__) {}
                    }
                    return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
                }
            });

            const purifyConfig = {
                ALLOWED_TAGS: ['h2','h3','h4','h5','h6','p','blockquote','ul','ol','li','a','strong','em','code','pre','img','br','hr','table','thead','tbody','tr','th','td','span','div','button','progress'],
                ALLOWED_ATTR: ['href','src','alt','class','id','loading','style','type','value','max','onclick']
            };

            function safeRender(mdText) {
                const raw = md.render(mdText);
                return DOMPurify.sanitize(raw, purifyConfig);
            }

            function getTextExcerpt(text, max = 110) {
                const div = document.createElement('div');
                div.innerHTML = safeRender(text);
                const s = (div.textContent || '').replace(/\s+/g, ' ').trim();
                return s.length > max ? s.slice(0, max) + '…' : s;
            }

            const postContainer = document.getElementById('dynamicPostList');
            const paginationEl = document.getElementById('pagination');
            const listView = document.getElementById('postList');
            const articleView = document.getElementById('articleView');
            const articleTitle = document.getElementById('articleTitle');
            const articleMeta = document.getElementById('articleMeta');
            const articleContent = document.getElementById('articleContent');
            const backLink = document.getElementById('backToList');
            const searchInput = document.getElementById('searchInput');

            let postsMeta = [];
            let allExcerpts = {};
            let currentPage = 1;
            const PER_PAGE = 5;

            function enhance(container) {
                container.querySelectorAll('pre').forEach(pre => {
                    if (pre.parentElement?.classList.contains('code-block-wrapper')) return;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(pre);
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn'; btn.textContent = '复制';
                    btn.onclick = async (e) => {
                        e.stopPropagation();
                        try {
                            await navigator.clipboard.writeText(pre.innerText);
                            btn.textContent = '已复制 ✓';
                            btn.classList.add('copied');
                            setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
                        } catch {
                            btn.textContent = '失败';
                            setTimeout(() => btn.textContent = '复制', 1500);
                        }
                    };
                    wrapper.appendChild(btn);
                });
                container.querySelectorAll('table').forEach(table => {
                    if (!table.closest('.table-responsive')) {
                        const wrap = document.createElement('div');
                        wrap.className = 'table-responsive';
                        table.parentNode.insertBefore(wrap, table);
                        wrap.appendChild(table);
                    }
                });
            }

            function filterPosts(query) {
                if (!query) return postsMeta;
                const q = query.toLowerCase();
                return postsMeta.filter(p => {
                    if (p.title.toLowerCase().includes(q)) return true;
                    if (p.tags.some(t => t.toLowerCase().includes(q))) return true;
                    if (p.date.toLowerCase().includes(q)) return true;
                    return false;
                });
            }

            function getPageCount(filtered) {
                return Math.ceil(filtered.length / PER_PAGE) || 1;
            }

            function getPagePosts(filtered, page) {
                const start = (page - 1) * PER_PAGE;
                return filtered.slice(start, start + PER_PAGE);
            }

            function renderPagination(filtered, current) {
                const total = getPageCount(filtered);
                let html = '';

                if (total <= 1) { paginationEl.innerHTML = ''; return; }

                const prevDisabled = current <= 1 ? 'disabled' : '';
                const nextDisabled = current >= total ? 'disabled' : '';

                html += `<button class="page-btn" data-page="${current - 1}" ${prevDisabled}>← 上一页</button>`;

                const range = 2;
                let startPage = Math.max(1, current - range);
                let endPage = Math.min(total, current + range);

                if (startPage > 1) {
                    html += `<button class="page-btn" data-page="1">1</button>`;
                    if (startPage > 2) html += `<span class="page-info">…</span>`;
                }
                for (let i = startPage; i <= endPage; i++) {
                    const active = i === current ? 'active' : '';
                    html += `<button class="page-btn ${active}" data-page="${i}">${i}</button>`;
                }
                if (endPage < total) {
                    if (endPage < total - 1) html += `<span class="page-info">…</span>`;
                    html += `<button class="page-btn" data-page="${total}">${total}</button>`;
                }

                html += `<button class="page-btn" data-page="${current + 1}" ${nextDisabled}>下一页 →</button>`;

                paginationEl.innerHTML = html;

                paginationEl.querySelectorAll('.page-btn:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const page = parseInt(btn.dataset.page);
                        if (page && page !== current) {
                            currentPage = page;
                            renderFiltered(filterPosts(searchInput.value));
                        }
                    });
                });
            }

            function renderFiltered(filtered) {
                const page = Math.min(currentPage, getPageCount(filtered));
                currentPage = page;
                const posts = getPagePosts(filtered, page);

                let html = '';
                posts.forEach(p => {
                    const tags = p.tags.map(t => {
                        let cls = 'tag';
                        if (t === 'Bash' || t === '终端') cls += ' bash';
                        else if (['表格','数据'].includes(t)) cls += ' test';
                        else cls += ' tech';
                        return `<span class="${cls}">${t}</span>`;
                    }).join('');
                    const excerpt = allExcerpts[p.id] || '';
                    html += `<div class="post-card" data-post-id="${p.id}" tabindex="0" role="button">
                        <div class="post-body">
                            <div class="post-meta"><span>${p.date}</span> ${tags} <span>📖 ${p.readTime}</span></div>
                            <h2 class="post-title">${p.title}</h2>
                            <p class="post-excerpt">${excerpt}</p>
                            <div class="post-footer"><a href="#/${p.id}" class="read-more">阅读全文 →</a><span class="post-date">${p.time}</span></div>
                        </div>
                    </div>`;
                });

                if (!html) {
                    html = '<div style="color:rgba(200,235,250,0.6);text-align:center;padding:2rem;">没有匹配的文章</div>';
                }

                postContainer.innerHTML = html;
                renderPagination(filtered, page);
            }

            function initList() {
                allExcerpts = {};
                let loaded = 0;
                const total = postsMeta.length;

                postsMeta.forEach(p => {
                    fetch('posts/' + p.file).then(r => r.text()).then(mdText => {
                        allExcerpts[p.id] = getTextExcerpt(mdText);
                        loaded++;
                        if (loaded === total) {
                            renderFiltered(filterPosts(searchInput.value));
                        }
                    }).catch(() => {
                        loaded++;
                        if (loaded === total) {
                            renderFiltered(filterPosts(searchInput.value));
                        }
                    });
                });

                if (total === 0) renderFiltered([]);

                postContainer.addEventListener('click', e => {
                    const card = e.target.closest('.post-card');
                    if (!card) return;
                    const id = card.dataset.postId;
                    if (id) { e.preventDefault(); navigateTo(id); }
                });
                postContainer.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        const card = e.target.closest('.post-card');
                        if (card) { e.preventDefault(); navigateTo(card.dataset.postId); }
                    }
                });
            }

            let searchTimer = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    currentPage = 1;
                    renderFiltered(filterPosts(searchInput.value));
                }, 250);
            });

            function navigateTo(id) {
                location.hash = '#/' + id;
            }

            async function loadArticle(id) {
                const meta = postsMeta.find(p => p.id === id);
                if (!meta) { showList(); return; }
                try {
                    const resp = await fetch('posts/' + meta.file);
                    const mdText = await resp.text();
                    articleTitle.textContent = meta.title;
                    const tags = meta.tags.map(t => `<span class="tag ${t==='Bash'?'bash':'tech'}">${t}</span>`).join(' ');
                    articleMeta.innerHTML = `${meta.date} · ${meta.time} · ${meta.readTime} ${tags}`;
                    articleContent.innerHTML = safeRender(mdText);
                    enhance(articleContent);
                    listView.style.display = 'none';
                    articleView.style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch {
                    showList();
                }
            }

            function showList() {
                listView.style.display = 'block';
                articleView.style.display = 'none';
                window.scrollTo({ top: 0 });
            }

            function handleHash() {
                const raw = location.hash.replace(/^#\/?/, '');
                if (raw && postsMeta.some(p => p.id === raw)) {
                    loadArticle(raw);
                } else {
                    showList();
                }
            }

            backLink.addEventListener('click', e => {
                e.preventDefault();
                if (location.hash !== '#/' && location.hash !== '') {
                    history.pushState(null, '', '#/');
                }
                showList();
            });

            window.addEventListener('hashchange', handleHash);

            fetch('posts/index.json')
                .then(r => r.json())
                .then(data => {
                    postsMeta = data;
                    initList();
                    handleHash();
                })
                .catch(() => {
                    postContainer.innerHTML = '<div style="color:white;text-align:center;padding:2rem;">文章加载失败</div>';
                });
        });
    })();
</script>
</body>
</html>
