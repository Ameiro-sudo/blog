  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      padding: var(--body-pad);
      padding-top: calc(var(--body-pad) + 4rem);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        url('assets/vendor/images/bg.webp') center / cover no-repeat fixed,
        var(--bg-gradient-body-light);
      overflow-x: hidden;
    }

    body.bg-loaded {
      background: var(--color-bg-deep) url('assets/vendor/images/bg.webp') center/cover fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--body-overlay);
      backdrop-filter: blur(2px);
      pointer-events: none;
      z-index: 0;
    }

    body>* {
      position: relative;
      z-index: 1;
    }

    #snowCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.5s ease 0.5s;
    }

    #loader.hidden~#snowCanvas {
      opacity: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg-gradient-loader-light);
      background-size: 200% 200%;
      animation: loaderBgShift 6s ease infinite;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
    }

    @keyframes loaderBgShift {
      0% {
        background-position: 0% 0%;
      }

      50% {
        background-position: 100% 100%;
      }

      100% {
        background-position: 0% 0%;
      }
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.05);
    }

    .loader-crystal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .crystal-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crystal-svg {
      width: 90px;
      height: 90px;
      animation: crystalFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 0 12px var(--color-accent-glow));
    }

    @keyframes crystalFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-8px) rotate(3deg);
      }

      75% {
        transform: translateY(4px) rotate(-2deg);
      }
    }

    .crystal-svg .main-line {
      stroke: var(--color-accent);
      stroke-dasharray: 360;
      stroke-dashoffset: 360;
      animation: drawCrystal 3.5s ease-in-out infinite alternate;
    }

    .crystal-svg .inner-line {
      stroke: var(--loader-stroke-inner);
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: drawCrystal 3.5s ease-in-out 0.6s infinite alternate;
    }

    .crystal-svg .core-line {
      stroke: var(--color-accent-warm);
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawCrystal 2.5s ease-in-out 1.2s infinite alternate;
    }

    @keyframes drawCrystal {
      0% {
        stroke-dashoffset: 360;
      }

      60% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    .crystal-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-accent-glow), transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.2);
      }
    }

    .loader-text-frost {
      font-family: var(--font-title);
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--loader-text-gradient));
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: frostShift 4s ease infinite;
    }

    @keyframes frostShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .loader-dots {
      display: flex;
      gap: 6px;
      margin-top: 0.2rem;
    }

    .loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotBounce {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.3;
      }

      50% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    @keyframes gradient-flow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    html.dark { color-scheme: dark; }

    html.dark body {
      background: var(--bg-gradient-body-dark);
      background-size: 400% 400%;
      animation: gradient-flow 20s ease infinite;
    }

    html.dark body::before {
      background: var(--body-overlay);
      backdrop-filter: blur(2px);
    }

    html.dark #loader {
      background: var(--bg-gradient-loader-dark);
      background-size: 200% 200%;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

      #snowCanvas {
        display: none;
      }
    }

    @media print {
      body::before {
        display: none;
      }

      body {
        background: #fff !important;
        padding: 1rem;
        color: #000;
      }

      #loader,
      #snowCanvas {
        display: none;
      }
    }
  </style>

  <script>
    if (location.search.includes('_gl=')) history.replaceState(null, '', location.pathname + location.hash)
      ; (function () {
        // loader: wait for bg image + minimum 1.5s display
        var loader = document.getElementById('loader')
        var bgImage = new Image()
        var bgLoaded = false
        var minPassed = false

        function hideLoader() {
          if (!bgLoaded || !minPassed) return
          if (loader.classList.contains('hidden')) return
          loader.classList.add('hidden')
          document.body.classList.add('bg-loaded')
          loader.addEventListener('transitionend', function () {
            loader.style.display = 'none'
          }, { once: true })
        }

        bgImage.src = 'assets/vendor/images/bg.webp'
        bgImage.onload = function () { bgLoaded = true; hideLoader() }
        bgImage.onerror = function () { bgLoaded = true; hideLoader() }
        setTimeout(function () { minPassed = true; hideLoader() }, 1500)
        // 5s fallback: force hide even if image never loaded
        setTimeout(function () {
          if (!loader.classList.contains('hidden')) {
            bgLoaded = true; minPassed = true; hideLoader()
          }
        }, 5000)

        // snow canvas particle system
        var canvas = document.getElementById('snowCanvas')
        var ctx = canvas.getContext('2d')
        var particles = []
        var W, H

        function resizeCanvas() {
          W = canvas.width = innerWidth
          H = canvas.height = innerHeight
        }

        function createParticle() {
          return {
            x: Math.random() * W,
            y: Math.random() * H - 20,
            r: Math.random() * 2.4 + 1,
            s: Math.random() * 0.6 + 0.2,
            w: Math.random() * 0.3 - 0.12,
            a: Math.random() * 0.4 + 0.15
          }
        }

        function initSnow() {
          particles = Array.from({ length: innerWidth < 768 ? 30 : 60 }, createParticle)
        }

        function drawSnow() {
          ctx.clearRect(0, 0, W, H)
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i]
            ctx.beginPath()
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
            ctx.fillStyle = 'rgba(255,255,255,' + p.a + ')'
            ctx.fill()
            p.y += p.s
            p.x += p.w
            if (p.y > H + 25) particles[i] = createParticle()
            if (p.x > W + 20) p.x = -15
            else if (p.x < -20) p.x = W + 10
          }
          while (particles.length < (innerWidth < 768 ? 40 : 60)) {
            particles.push(createParticle())
          }
          requestAnimationFrame(drawSnow)
        }

        addEventListener('resize', resizeCanvas)
        resizeCanvas()
        initSnow()
        drawSnow()
      })();
  </script>
