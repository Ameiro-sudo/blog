    <style>
        :root {
            --color-bg-deep: #0b2b3b;
            --color-accent: #8fd8ef;
            --glass-bg: rgba(255,255,255,0.12);
            --glass-border: rgba(255,255,255,0.20);
            --glass-hover-bg: rgba(255,255,255,0.22);
            --glass-header-bg: rgba(11,43,59,0.55);
            --shadow-card: 0 30px 60px -16px rgba(0,0,0,0.45);
            --shadow-item: 0 4px 16px -6px rgba(0,0,0,0.15);
            --shadow-toast: 0 8px 30px rgba(0,0,0,0.35);
            --radius-card: 3rem;
            --radius-item: 1.5rem;
            --font-mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
            --font-sans: 'Segoe UI',Roboto,'Helvetica Neue',system-ui,-apple-system,sans-serif;
            --font-title: 'ZCOOL KuaiLe', cursive, var(--font-sans);
            --body-pad: clamp(1.2rem, 5.88vw, 2.5rem);
            --heatmap-empty: rgba(255,255,255,0.04);
            --heatmap-l1: rgba(100,200,255,0.12);
            --heatmap-l2: rgba(100,200,255,0.30);
            --heatmap-l3: rgba(100,200,255,0.55);
            --heatmap-l4: rgba(100,200,255,0.80);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            padding: var(--body-pad);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            background:
                url('https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/blog/138936740_p0.webp') center / cover no-repeat fixed,
                linear-gradient(160deg, #cce7f5, #b3daf2, #9fccee);
            overflow-x: hidden;
        }

        body.bg-loaded {
            background: var(--color-bg-deep) url('https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/blog/138936740_p0.webp') center/cover fixed;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.30);
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 0;
        }

        body > * { position: relative; z-index: 1; }

        #snowCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }

        #loader.hidden ~ #snowCanvas {
            opacity: 1;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #d4eaf7, #b8d8ee, #d4eaf7);
            background-size: 200% 200%;
            animation: loaderBgShift 6s ease infinite;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
        }

        @keyframes loaderBgShift {
            0%   { background-position: 0% 0%; }
            50%  { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
        }

        .loader-crystal {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .crystal-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crystal-svg {
            width: 90px;
            height: 90px;
            animation: crystalFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(143,216,239,0.3));
        }

        @keyframes crystalFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(-8px) rotate(3deg); }
            75%      { transform: translateY(4px) rotate(-2deg); }
        }

        .crystal-svg .main-line {
            stroke-dasharray: 360;
            stroke-dashoffset: 360;
            animation: drawCrystal 3.5s ease-in-out infinite alternate;
        }

        .crystal-svg .inner-line {
            stroke-dasharray: 240;
            stroke-dashoffset: 240;
            animation: drawCrystal 3.5s ease-in-out 0.6s infinite alternate;
        }

        .crystal-svg .core-line {
            stroke-dasharray: 80;
            stroke-dashoffset: 80;
            animation: drawCrystal 2.5s ease-in-out 1.2s infinite alternate;
        }

        @keyframes drawCrystal {
            0%   { stroke-dashoffset: 360; }
            60%  { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 0; }
        }

        .crystal-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(143,216,239,0.15), transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.8; transform: scale(1.2); }
        }

        .loader-text-frost {
            font-family: var(--font-title);
            font-size: 1.3rem;
            background: linear-gradient(135deg, #8fd8ef, #c0f0ff, #ffe6b0, #8fd8ef);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: frostShift 4s ease infinite;
        }

        @keyframes frostShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .loader-dots {
            display: flex;
            gap: 6px;
            margin-top: 0.2rem;
        }

        .loader-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8fd8ef;
            animation: dotBounce 1.2s ease-in-out infinite;
        }

        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50%      { transform: translateY(-8px); opacity: 1; }
        }

        @media (prefers-color-scheme: dark) {
            #loader { background: linear-gradient(135deg, #0d1f2b, #142a38, #0d1f2b); background-size: 200% 200%; }
            body { background: url(https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/blog/138936740_p0.webp) center/cover fixed, linear-gradient(160deg,#0b1a24,#162b36); }
            body::before { background: rgba(0,0,0,0.35); backdrop-filter: blur(2px); }
        }
    </style>

</head>

<script>
if(location.search.includes('_gl='))history.replaceState(null,'',location.pathname+location.hash)
!function(){
var l=document.getElementById('loader'),i=new Image,b=!1,m=!1;
i.src='https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/blog/138936740_p0.webp';
i.onload=function(){b=!0;f()};
i.onerror=function(){b=!0;f()};
setTimeout(function(){m=!0;f()},1500);
setTimeout(function(){if(!l.classList.contains('hidden')){b=!0;m=!0;f()}},5000);
function f(){if(b&&m&&!l.classList.contains('hidden')){l.classList.add('hidden');document.body.classList.add('bg-loaded');l.addEventListener('transitionend',function(){l.style.display='none'},{once:true})}}
var n=document.getElementById('snowCanvas'),t=n.getContext('2d'),p=[],w,h;
function rs(){w=n.width=innerWidth;h=n.height=innerHeight}
function cp(){return{x:Math.random()*w,y:Math.random()*h-20,r:Math.random()*2.4+1,s:Math.random()*.6+.2,w:Math.random()*.3-.12,a:Math.random()*.4+.15}}
function is(){p=Array.from({length:window.innerWidth<768?30:60},cp)}
function ds(){t.clearRect(0,0,w,h);for(var e=0;e<p.length;e++){var o=p[e];t.beginPath(),t.arc(o.x,o.y,o.r,0,Math.PI*2),t.fillStyle='rgba(255,255,255,'+o.a+')',t.fill(),o.y+=o.s,o.x+=o.w,o.y>h+25&&(p[e]=cp()),o.x>w+20?o.x=-15:o.x<-20&&(o.x=w+10)}for(;p.length<(window.innerWidth<768?40:60);)p.push(cp());requestAnimationFrame(ds)}
addEventListener('resize',rs);rs();is();ds();
}();
</script>
