<script>
    (function(){
        // ---------- 背景预加载与最小延迟 ----------
        const loader = document.getElementById('loader');
        let bgReady = false, timeReady = false;
        const MIN_LOAD = 650;
        const bgImg = new Image();
        function tryFinish() {
            if (bgReady && timeReady) {
                document.body.classList.add('bg-loaded');
                requestAnimationFrame(() => {
                    loader.classList.add('hide');
                    setTimeout(() => loader?.parentNode?.removeChild(loader), 500);
                });
            }
        }
        bgImg.onload = () => { bgReady = true; tryFinish(); };
        bgImg.onerror = () => { bgReady = true; tryFinish(); };
        bgImg.src = 'https://snowblock.top/138936740_p0.webp';
        if (bgImg.complete) bgReady = true;
        setTimeout(() => { timeReady = true; tryFinish(); }, MIN_LOAD);

        // ---------- 雪花飘落 ----------
        const canvas = document.getElementById('snowCanvas');
        let ctx = canvas.getContext('2d');
        let particles = [];
        let w, h;
        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            if (particles.length) {
                for (let p of particles) {
                    if (p.x > w + 15) p.x = w - 5;
                    if (p.x < -15) p.x = 5;
                    if (p.y > h + 30) p.y = -10;
                }
            }
        }
        function createParticle() {
            return {
                x: Math.random() * w,
                y: Math.random() * h - 20,
                r: Math.random() * 2.4 + 1.0,
                speed: Math.random() * 0.6 + 0.2,
                wind: Math.random() * 0.3 - 0.12,
                alpha: Math.random() * 0.4 + 0.15
            };
        }
        function initSnow() {
            particles = [];
            for (let i = 0; i < 48; i++) particles.push(createParticle());
        }
        function drawSnow() {
            if (!ctx) return;
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
                p.y += p.speed;
                p.x += p.wind;
                if (p.y > h + 25) particles[i] = createParticle();
                if (p.x > w + 20) p.x = -15;
                if (p.x < -20) p.x = w + 10;
            }
            while (particles.length < 55) particles.push(createParticle());
            requestAnimationFrame(drawSnow);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        resizeCanvas();
        initSnow();
        drawSnow();

        // ---------- 用户提供的文章数据（已修正第三篇结构） ----------
        const posts = {
            1: {
                title: '图床测试 · 静态资源占位',
                date: '2026-06-05', tags: ['测试', '图床'], readTime: '3 分钟', time: '09:30',
                content: [
                    '<p>测试图片加载和样式兼容性：</p>',
                    '<img src="https://picsum.photos/id/104/800/450" alt="示例图片" loading="lazy">',
                    '<p>此图片仅用于验证页面布局和加载性能。</p>',
                    '<blockquote>编号 1</blockquote>'
                ]
            },
            2: {
                title: 'Bash 命令示例 · 系统检查',
                date: '2026-06-04', tags: ['Bash', '终端'], readTime: '5 分钟', time: '14:20',
                content: [
                    '<p>显示系统资源和状态：</p>',
                    '<pre><code class="language-bash">#!/bin/bash\n# 显示磁盘使用情况\ndf -h | grep -E "^(/dev/)"\n# 内存使用\nfree -m\n# 系统负载\nuptime</code></pre>',
                    '<p>批量处理文件：</p>',
                    '<pre><code class="language-bash">for file in *.txt; do\n  mv "$file" "${file%.txt}.bak"\ndone</code></pre>'
                ]
            },
            3: {
                title: 'HTML 渲染 · UI 组件测试',
                date: '2026-06-03', tags: ['HTML', 'UI'], readTime: '4 分钟', time: '11:05',
                content: [
                    '<p>HTML/CSS 元素测试：</p>',
                    '<div class="inline-html-demo">',
                    '<div style="display: flex; gap: 1rem; flex-wrap: wrap;">',
                    '<div class="status-badge">服务状态: 正常</div>',
                    '<div class="status-badge">响应时间: 24ms</div>',
                    '</div>',

        // 智能摘要: 从内容数组提取纯文本前120字
        function getTextExcerpt(contentArr, maxLen = 120) {
            const rawHtml = contentArr.join('');
            const div = document.createElement('div');
            div.innerHTML = rawHtml;
            const text = (div.textContent || div.innerText || '').trim().replace(/\s+/g, ' ');
            return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
        }

        // 代码块复制按钮 + 表格滚动增强
        function addCopyButtons(container) {
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.parentElement?.classList?.contains('code-block-wrapper')) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = '复制';
                btn.setAttribute('aria-label', '复制代码片段');
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const code = pre.innerText;
                    try {
                        await navigator.clipboard.writeText(code);
                        btn.textContent = '已复制 ✓';
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.textContent = '复制';
                            btn.classList.remove('copied');
                        }, 2000);
                    } catch { 
                        btn.textContent = '失败';
                        setTimeout(() => btn.textContent = '复制', 1500);
                    }
                };
                wrapper.appendChild(btn);
            });
            // 为所有未包装的表格添加滚动容器
            const tables = container.querySelectorAll('table');
            tables.forEach(table => {
                if (!table.closest('.table-responsive')) {
                    const wrap = document.createElement('div');
                    wrap.className = 'table-responsive';
                    table.parentNode.insertBefore(wrap, table);
                    wrap.appendChild(table);
                }
            });
        }

        // DOM 元素
        const postContainer = document.getElementById('dynamicPostList');
        const listView = document.getElementById('postList');
        const articleView = document.getElementById('articleView');
        const articleTitle = document.getElementById('articleTitle');
        const articleMetaSpan = document.getElementById('articleMeta');
        const articleContentDiv = document.getElementById('articleContent');
        const backLink = document.getElementById('backToList');

        function renderPostList() {
            let html = '';
            for (const id in posts) {
                const p = posts[id];
                const tagHtml = p.tags.map(t => {
                    let cls = 'tag';
                    if (t === 'Bash' || t === '终端') cls += ' bash';
                    else if (t === '表格' || t === '数据') cls += ' test';
                    else cls += ' tech';
                    return `<span class="${cls}">${t}</span>`;
                }).join('');
                const excerpt = getTextExcerpt(p.content, 110);
                html += `
                    <div class="post-card" data-post-id="${id}" tabindex="0" role="button" aria-label="阅读文章：${p.title}">
                        <div class="post-body">
                            <div class="post-meta">
                                <span>${p.date}</span> ${tagHtml} <span>📖 ${p.readTime}</span>
                            </div>
                            <h2 class="post-title">${escapeHtml(p.title)}</h2>
                            <p class="post-excerpt">${escapeHtml(excerpt)}</p>
                            <div class="post-footer">
                                <a href="#" class="read-more" data-post="${id}" aria-label="阅读全文">阅读全文 →</a>
                                <span class="post-date">${p.time}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            postContainer.innerHTML = html;
            attachEvents();
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

        function attachEvents() {
            document.querySelectorAll('.read-more[data-post]').forEach(link => {
                link.addEventListener('click', (e) => { e.preventDefault(); showArticle(link.getAttribute('data-post')); });
            });
            document.querySelectorAll('.post-card').forEach(card => {
                const id = card.getAttribute('data-post-id');
                if (!id) return;
                card.addEventListener('click', (e) => { if (!e.target.closest('.read-more')) showArticle(id); });
                card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showArticle(id); } });
            });
        }

        function showArticle(postId) {
            const post = posts[postId];
            if (!post) return;
            articleTitle.textContent = post.title;
            const tagsHtml = post.tags.map(t => `<span class="tag ${t === 'Bash' ? 'bash' : 'tech'}">${t}</span>`).join(' ');
            articleMetaSpan.innerHTML = `${post.date} · ${post.time} · ${post.readTime} ${tagsHtml}`;
            articleContentDiv.innerHTML = post.content.join('');
            addCopyButtons(articleContentDiv);
            listView.style.display = 'none';
            articleView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        backLink.addEventListener('click', (e) => {
            e.preventDefault();
            listView.style.display = 'block';
            articleView.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        renderPostList();
    })();
</script>
