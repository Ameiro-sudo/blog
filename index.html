<script>
    (function(){
        // ========== 背景加载与 Loader ==========
        const loader = document.getElementById('loader');
        let bgReady = false, timeReady = false;
        const MIN_LOAD = 650;
        const bgImg = new Image();
        function tryFinish() {
            if (bgReady && timeReady) {
                document.body.classList.add('bg-loaded');
                requestAnimationFrame(() => {
                    loader.classList.add('hide');
                    setTimeout(() => loader?.remove(), 500);
                });
            }
        }
        bgImg.onload = () => { bgReady = true; tryFinish(); };
        bgImg.onerror = () => { bgReady = true; tryFinish(); };
        bgImg.src = 'https://snowblock.top/138936740_p0.webp';
        if (bgImg.complete) bgReady = true;
        setTimeout(() => { timeReady = true; tryFinish(); }, MIN_LOAD);

        // ========== 雪花 Canvas ==========
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let w, h;
        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles.forEach(p => {
                if (p.x > w + 15) p.x = w - 5;
                if (p.x < -15) p.x = 5;
                if (p.y > h + 30) p.y = -10;
            });
        }
        function createParticle() {
            return {
                x: Math.random() * w,
                y: Math.random() * h - 20,
                r: Math.random() * 2.4 + 1.0,
                speed: Math.random() * 0.6 + 0.2,
                wind: Math.random() * 0.3 - 0.12,
                alpha: Math.random() * 0.4 + 0.15
            };
        }
        function initSnow() {
            particles = Array.from({ length: 48 }, createParticle);
        }
        function drawSnow() {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
                ctx.fill();
                p.y += p.speed;
                p.x += p.wind;
                if (p.y > h + 25) particles[i] = createParticle();
                if (p.x > w + 20) particles[i].x = -15;
                if (p.x < -20) particles[i].x = w + 10;
            }
            while (particles.length < 55) particles.push(createParticle());
            requestAnimationFrame(drawSnow);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initSnow();
        drawSnow();

        // ========== 等待依赖加载 ==========
        // 依赖通过 defer 加载，确保 markdown-it, hljs, DOMPurify 可用
        window.addEventListener('load', () => {
            if (!window.markdownit || !window.hljs || !window.DOMPurify) {
                document.body.innerHTML += '<div style="color:white;text-align:center;padding:2rem;">依赖加载失败，请刷新页面</div>';
                return;
            }
            initApp();
        });

        function initApp() {
            // ========== Markdown 解析器配置 ==========
            const md = window.markdownit({
                html: true,          // 允许内嵌 HTML（但会经过 DOMPurify 净化）
                linkify: true,
                typographer: true,
                breaks: false,
                highlight: function (str, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return '<pre class="hljs"><code>' +
                                   hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                                   '</code></pre>';
                        } catch (__) {}
                    }
                    return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
                }
            });

            // DOMPurify 白名单配置
            const purifyConfig = {
                ALLOWED_TAGS: ['h2','h3','h4','h5','h6','p','blockquote','ul','ol','li','a','strong','em','code','pre','img','br','hr','table','thead','tbody','tr','th','td','span','div','button','progress','style','input'],
                ALLOWED_ATTR: ['href','src','alt','class','id','loading','style','type','value','max','onclick'],
                ALLOW_DATA_ATTR: false,
                ALLOW_UNKNOWN_PROTOCOLS: false
            };

            // 净化函数
            function safeRender(markdown) {
                const rawHtml = md.render(markdown);
                return DOMPurify.sanitize(rawHtml, purifyConfig);
            }

            // ========== 文章数据 (Markdown) ==========

            // ========== 智能摘要提取 ==========
            function getTextExcerpt(mdText, maxLen = 120) {
                const html = safeRender(mdText);
                const div = document.createElement('div');
                div.innerHTML = html;
                const text = (div.textContent || '').replace(/\s+/g, ' ').trim();
                return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
            }

            // ========== DOM 元素 ==========
            const postContainer = document.getElementById('dynamicPostList');
            const listView = document.getElementById('postList');
            const articleView = document.getElementById('articleView');
            const articleTitle = document.getElementById('articleTitle');
            const articleMeta = document.getElementById('articleMeta');
            const articleContent = document.getElementById('articleContent');
            const backLink = document.getElementById('backToList');

            // ========== 代码复制按钮 & 表格包装 ==========
            function enhanceContent(container) {
                // 代码复制按钮
                container.querySelectorAll('pre').forEach(pre => {
                    if (pre.parentElement?.classList.contains('code-block-wrapper')) return;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(pre);
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.textContent = '复制';
                    btn.setAttribute('aria-label', '复制代码片段');
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const code = pre.innerText;
                        try {
                            await navigator.clipboard.writeText(code);
                            btn.textContent = '已复制 ✓';
                            btn.classList.add('copied');
                            setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
                        } catch {
                            btn.textContent = '失败';
                            setTimeout(() => btn.textContent = '复制', 1500);
                        }
                    });
                    wrapper.appendChild(btn);
                });

                // 表格响应式容器
                container.querySelectorAll('table').forEach(table => {
                    if (!table.closest('.table-responsive')) {
                        const wrap = document.createElement('div');
                        wrap.className = 'table-responsive';
                        table.parentNode.insertBefore(wrap, table);
                        wrap.appendChild(table);
                    }
                });
            }

            // ========== 渲染文章列表 (事件委托) ==========
            function renderPostList() {
                let html = '';
                Object.entries(posts).forEach(([id, p]) => {
                    const tagHtml = p.tags.map(t => {
                        let cls = 'tag';
                        if (t === 'Bash' || t === '终端') cls += ' bash';
                        else if (['表格','数据'].includes(t)) cls += ' test';
                        else cls += ' tech';
                        return `<span class="${cls}">${t}</span>`;
                    }).join('');
                    const excerpt = getTextExcerpt(p.markdown, 110);
                    html += `
                        <div class="post-card" data-post-id="${id}" tabindex="0" role="button" aria-label="阅读文章：${escapeHtml(p.title)}">
                            <div class="post-body">
                                <div class="post-meta">
                                    <span>${p.date}</span> ${tagHtml} <span>📖 ${p.readTime}</span>
                                </div>
                                <h2 class="post-title">${escapeHtml(p.title)}</h2>
                                <p class="post-excerpt">${escapeHtml(excerpt)}</p>
                                <div class="post-footer">
                                    <a href="#" class="read-more" data-post="${id}" aria-label="阅读全文">阅读全文 →</a>
                                    <span class="post-date">${p.time}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                postContainer.innerHTML = html;

                // 事件委托 (点击与键盘)
                postContainer.addEventListener('click', handlePostClick);
                postContainer.addEventListener('keydown', handlePostKeydown);
            }

            function escapeHtml(str) {
                return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
            }

            function handlePostClick(e) {
                const card = e.target.closest('.post-card');
                if (!card) return;
                if (e.target.closest('.read-more')) {
                    e.preventDefault();
                }
                const id = card.dataset.postId;
                if (id) showArticle(id);
            }

            function handlePostKeydown(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    const card = e.target.closest('.post-card');
                    if (card) {
                        e.preventDefault();
                        const id = card.dataset.postId;
                        if (id) showArticle(id);
                    }
                }
            }

            // ========== 显示文章详情 ==========
            function showArticle(postId) {
                const post = posts[postId];
                if (!post) return;
                articleTitle.textContent = post.title;
                const tagsHtml = post.tags.map(t => `<span class="tag ${t==='Bash'?'bash':'tech'}">${t}</span>`).join(' ');
                articleMeta.innerHTML = `${post.date} · ${post.time} · ${post.readTime} ${tagsHtml}`;
                const cleanHtml = safeRender(post.markdown);
                articleContent.innerHTML = cleanHtml;
                enhanceContent(articleContent);
                listView.style.display = 'none';
                articleView.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            backLink.addEventListener('click', (e) => {
                e.preventDefault();
                listView.style.display = 'block';
                articleView.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ========== 启动 ==========
            renderPostList();
        }
    })();
</script>
