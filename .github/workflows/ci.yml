name: CI Build & Deploy

# 门禁排在部署前面：作者早就写好了两个质量工具（scripts/visual-check.cjs 的标题
# 字体断言、scripts/font-coverage-check.py 的字形覆盖），但它们只在本地手动跑，
# 于是每次 a11y 修复都只能靠人记得再验一遍——修完没有闸门，下一次改动照样回归。
# 现在它们和 Lighthouse 一样是硬门禁，失败就不会部署。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: blog-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（内容索引 + Nuxt SSG + 静态资源并入）
        run: npm run build

      - name: 装 Chromium（visual-check / Lighthouse 共用）
        run: npx playwright-core install --with-deps chromium

      - name: 起本地预览
        run: |
          node scripts/serve-dist.cjs &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ -o /dev/null; then echo "serve ready"; exit 0; fi
            sleep 0.5
          done
          echo "serve 未在 20s 内就绪" >&2
          exit 1

      - name: 视觉 / 排版自检（标题必须真的用 ZCOOL KuaiLe 且没被横向截断）
        # 退出码 0/1/2 本身就是门禁：0 全过，1 有 BAD 项，2 找不到浏览器。
        run: node scripts/visual-check.cjs

      - name: 标题字体子集覆盖检查
        # 少一个字形，那个字会静默回退成系统字体——正是「标题里一个字的字体和
        # 其余不同」这个 bug。fontTools 是未声明的外部前置条件，这里显式装上。
        run: |
          python -m pip install --quiet fonttools brotli
          python scripts/font-coverage-check.py

      - name: Lighthouse CI（收集 + 断言）
        # collect 排在 assert 前面是必须的：assert 只在 collect 产出的报告上跑。
        # 部署排在两者之后，所以性能或可访问性退了就发不出去。
        run: |
          npx lhci collect --config=./scripts/lighthouserc.cjs
          npx lhci assert --config=./scripts/lighthouserc.cjs

      - name: axe 可访问性扫描（全站页面）
        # Lighthouse 只扫首页，而首页通过不代表 /posts/post8/、/gallery/ 通过。
        # A 站与 B 站早就有这道门禁了，blog 一直没有——两个 Vue 应用都缺，
        # 而可访问性恰恰是最容易在改版时整片回归的东西。
        #
        # 必须扫真 HTTP origin：传本地文件路径时 @axe-core/cli 会请求**自己**
        # 的服务器，那个地址不存在，于是它拿回一个错误页并对着错误页报错——
        # 实测报出过「没有 main landmark」和一个幻影 id，而那个文件明明有。
        # 端口沿用起预览那一步的 4173。
        #
        # --load-delay 1500：默认是 0，也就是 load 事件一触发就开始扫。这个站首屏要下
        # 140KB 的 bg.webp 与两个字体文件，扫得太早等于量一个还没成型的页面——
        # 之前 /moments/ 在 CI 上稳定报 7 处 color-contrast 而本地怎么跑都是 0，
        # 而把玻璃 alpha 从 0.65 提到 0.90（实测最坏底色下六支文字色全部达标）
        # 之后 CI 报的**还是一模一样的 7 处**。一个能把所有比值都抬过去的改动
        # 在结果里看不出任何痕迹，说明 CI 量到的根本不是同一个东西。
        # 留出时间让它成型，是门禁能做对比的前提。
        #
        # --save 把完整结果落盘并在下面作为 artifact 上传：CI 的文本报告只给
        # 「哪条规则、哪些选择器」，不给**前景色/背景色/实际比值**。三处红的
        # 排查全靠猜——下次至少不用猜。
        run: |
          npx --yes @axe-core/cli@latest --exit --load-delay 1500 --save axe-report \
            http://127.0.0.1:4173/ \
            http://127.0.0.1:4173/posts/ \
            http://127.0.0.1:4173/posts/post1/ \
            http://127.0.0.1:4173/posts/post8/ \
            http://127.0.0.1:4173/archive/ \
            http://127.0.0.1:4173/gallery/ \
            http://127.0.0.1:4173/gallery/photo-wall/ \
            http://127.0.0.1:4173/moments/ \
            http://127.0.0.1:4173/friends/ \
            http://127.0.0.1:4173/about/

      - name: 上传 axe 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: axe-report
          if-no-files-found: ignore
      # ---------------------------------------------------------------
      # 设计令牌漂移检查
      #
      # 三个静态站的 assets/css/tokens.css 是同一套设计令牌的三份副本。
      # 实测过：三站里只有这一份是共享资产——style.css 三份全不同、toast.css
      # 只有两站有、shell.css 只有 blog 有，它们是各站自己的样式表。
      #
      # 比的是每一处自定义属性的取值（按出现顺序），不是文件字节：注释各站自己写。
      # 只比每个属性的「最后一个值」是不够的——深色主题在文件后面，最后一个值永远
      # 是深色的，浅色那处漂移就查不出来（第一版就是这么写的，注入一处浅色改动
      # 试过，没报）。
      #
      # 期望的摩擦：改了一处而另外两站没跟上时，这几仓的构建会一起红。这正是它的
      # 作用——把「改一处要记得同步另外两处」从口头约定变成会红的检查。
      # 两边都像是故意的，就挑一个当成本次改动的意图，把另一个对齐它。
      - name: 设计令牌漂移检查
        run: |
          node scripts/check-tokens-drift.mjs \
            'B=https://raw.githubusercontent.com/Ameiro-sudo/inecraft-Server-Status-test/main/assets/css/tokens.css' \
            'blog=https://raw.githubusercontent.com/Ameiro-sudo/blog/main/assets/css/tokens.css'

      - name: 上传 Lighthouse 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

      - name: 上传视觉自检截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: .visual-check
          if-no-files-found: ignore

      - name: 部署 gh-pages（SSG 产物）
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          force_orphan: true